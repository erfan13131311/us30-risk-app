<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ماشین حساب ریسک US30</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--tg-theme-bg-color, #17212b);
      color: var(--tg-theme-text-color, #ffffff);
      padding: 16px;
      margin: 0;
    }
    .card {
      background: var(--tg-theme-secondary-bg-color, #232e3c);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--tg-theme-hint-color, #7e8b99);
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #364454;
      background: #0f1621;
      color: #fff;
      font-size: 15px;
      margin-bottom: 12px;
    }
    .result-box {
      border: 1px dashed #2ea6ff;
      border-radius: 8px;
      padding: 12px;
      background: rgba(46, 166, 255, 0.08);
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 14px;
    }
    .highlight {
      font-weight: bold;
      color: #2ea6ff;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <label>موجودی حساب (دلار):</label>
    <input type="number" id="balance" value="10000" oninput="calculate()">

    <label>درصد ریسک (%):</label>
    <input type="number" id="riskPercent" value="1.0" step="0.1" oninput="calculate()">

    <label>فاصله استاپ‌لاس (واحد شاخص US30):</label>
    <input type="number" id="slDistance" value="50" oninput="calculate()">

    <div class="result-box">
      <div class="result-row">
        <span>مبلغ ریسک:</span>
        <span id="riskCash">$100.00</span>
      </div>
      <div class="result-row">
        <span>حجم مجاز معامله:</span>
        <span id="lotSize" class="highlight">2.00 Lot</span>
      </div>
      <div class="result-row">
        <span>تارگت پیشنهادی (1:2):</span>
        <span id="tpDistance">100 واحد</span>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function calculate() {
      const balance = parseFloat(document.getElementById('balance').value) || 0;
      const riskPercent = parseFloat(document.getElementById('riskPercent').value) || 0;
      const slDist = parseFloat(document.getElementById('slDistance').value) || 0;

      const riskCash = balance * (riskPercent / 100.0);
      document.getElementById('riskCash').innerText = '$' + riskCash.toFixed(2);

      if (slDist <= 0) {
        document.getElementById('lotSize').innerText = '0.00 Lot';
        document.getElementById('tpDistance').innerText = '0 واحد';
        return;
      }

      // در داوجونز با Contract Size = 1، هر 1 واحد تغییر معادل 1 دلار به ازای 1 لات است
      const calculatedLots = riskCash / slDist;
      
      // گرد کردن تا ۲ رقم اعشار متناسب با حداقل گام 0.01 لات
      const normalizedLots = Math.floor(calculatedLots * 100) / 100;

      document.getElementById('lotSize').innerText = normalizedLots.toFixed(2) + ' Lot';
      document.getElementById('tpDistance').innerText = (slDist * 2).toFixed(1) + ' واحد';
    }

    calculate();
  </script>
</body>
</html>
